name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory ./test-results/

      - name: Package
        run: dotnet pack --no-build --configuration Release --output ./build-output/ -p:Version=${{ steps.version.outputs.version }}

      - name: Upload nuget package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Nuget Packages
          path: ./build-output/

      - name: Publish
        run: dotnet nuget push "./build-output/*.nupkg" --source nuget.org --api-key ${{ secrets.NUGET_TOKEN }}
